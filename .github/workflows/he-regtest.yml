name: he-regtest

on:
  workflow_dispatch:

jobs:
  regtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        email:
          - skrvotesx1@firemail.de
          - skrvotesx1@emailondeck.com
          - skrvotesx1@hotmailbox.me
          - skrvotesx1@mailto.cc
          - skrvotesx1@maildax.com
          - skrvotesx1@getmail.ca
          - skrvotesx1@mail4all.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ddddocr
      - run: python he_regtest.py "${{ matrix.email }}"
