name: he-regtest

on:
  workflow_dispatch:

jobs:
  regtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        email:
          - skrvote1@yahoo.co.jp
          - skrvote1@mailinator3.com
          - skrvote1@emailondeck.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ddddocr
      - run: python he_regtest.py "${{ matrix.email }}"
